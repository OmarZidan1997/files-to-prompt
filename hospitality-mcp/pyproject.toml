[project]
name = "hospitality-mcp"
version = "0.1.0"
description = "An MCP server for hospitality / vacation-rental operations: daily turnovers, check-ins, guest notes, complaints and luggage holds."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest"]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "anthropic>=0.40",
    "itsdangerous>=2.0",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
hospitality-mcp = "hospitality_mcp.server:main"
hospitable-gateway = "hospitality_mcp.gateway:main"
hospitality-web = "hospitality_mcp.web.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hospitality_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
